{% extends "base.html" %}
{% block content %}
<div class="row"><div class="col-lg-6">
  <div class="card"><div class="card-body">
    <p class="text-muted small mb-4">
      This creates an invitation, not an account. They set their own password
      when they open the link, so no password is ever stored or shared.
    </p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/_form.html" %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Send invitation</button>
        <a class="btn btn-outline-secondary" href="{% url 'members:list' %}">Cancel</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
