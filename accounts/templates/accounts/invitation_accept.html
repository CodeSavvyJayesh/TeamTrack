{% extends "base_public.html" %}
{% block title %}Accept your invitation &middot; TeamTrack{% endblock %}

{% block content %}
<h1 class="h5 mb-1">Welcome, {{ invitation.full_name }}</h1>
<p class="text-muted small mb-4">
  Choose a password for <strong>{{ invitation.email }}</strong>. That's all that's left.
</p>

<form method="post" novalidate>
  {% csrf_token %}
  {% include "partials/_form.html" %}
  <button type="submit" class="btn btn-primary w-100">Create my account</button>
</form>
{% endblock %}
