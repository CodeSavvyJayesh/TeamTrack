{% extends "base.html" %}
{% block content %}
<div class="row">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "partials/_form.html" %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a class="btn btn-outline-secondary" href="{% url 'accounts:profile' %}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
    <p class="text-muted small mt-2 mb-0">
      Only your name and phone number are yours to change. Everything else is
      administrative and is set for you.
    </p>
  </div>
</div>
{% endblock %}
