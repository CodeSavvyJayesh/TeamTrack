# Render blueprint. In the Render dashboard: New -> Blueprint -> pick this repo,
# and everything below is created for you.
#
# Values marked sync:false are NOT stored in this file and never reach GitHub -
# Render asks for them once, in its dashboard.

databases:
  - name: teamtrack-db
    databaseName: teamtrack
    user: teamtrack
    plan: free           # upgrade before this matters; free databases expire
    region: singapore    # closest to Mumbai

services:
  - type: web
    name: teamtrack
    runtime: python
    plan: free
    region: singapore
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 2 --timeout 60 --access-logfile - --error-logfile -"
    healthCheckPath: /accounts/login/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true        # Render generates it; nobody ever sees it
      - key: DATABASE_URL
        fromDatabase:
          name: teamtrack-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: TIME_ZONE
        value: Asia/Kolkata
      # --- Email --------------------------------------------------------
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # --- Uploaded files (Cloudflare R2 or any S3-compatible store) -----
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      # --- First administrator (remove ADMIN_PASSWORD after first deploy)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # --- Application rules --------------------------------------------
      - key: INVITATION_EXPIRY_DAYS
        value: "7"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: ATTENDANCE_MAX_HOURS
        value: "9"

# The nightly attendance cleanup deliberately does NOT live here.
#
# Render (and Railway) charge for scheduled jobs, and adding one to this file
# is what makes the Blueprint demand a payment method before it will deploy
# anything at all - including the free web service and database.
#
# It runs on GitHub Actions instead, for free:
#   .github/workflows/close-stale-attendance.yml
