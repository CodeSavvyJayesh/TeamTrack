# Render blueprint. In the Render dashboard: New -> Blueprint -> pick this repo,
# and everything below is created for you.
#
# Values marked sync:false are NOT stored in this file and never reach GitHub -
# Render asks for them once, in its dashboard.

databases:
  - name: teamtrack-db
    databaseName: teamtrack
    user: teamtrack
    plan: free           # upgrade before this matters; free databases expire
    region: singapore    # closest to Mumbai

services:
  - type: web
    name: teamtrack
    runtime: python
    plan: free
    region: singapore
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 2 --timeout 60 --access-logfile - --error-logfile -"
    healthCheckPath: /accounts/login/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true        # Render generates it; nobody ever sees it
      - key: DATABASE_URL
        fromDatabase:
          name: teamtrack-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: TIME_ZONE
        value: Asia/Kolkata
      # --- Email --------------------------------------------------------
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # --- Uploaded files (Cloudflare R2 or any S3-compatible store) -----
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      # --- First administrator (remove ADMIN_PASSWORD after first deploy)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # --- Application rules --------------------------------------------
      - key: INVITATION_EXPIRY_DAYS
        value: "7"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: ATTENDANCE_MAX_HOURS
        value: "9"

  # Closes attendance sessions nobody signed out of. Without this one job the
  # numbers drift: a single forgotten sign-out becomes a 40-hour "day".
  - type: cron
    name: teamtrack-close-stale-attendance
    runtime: python
    plan: starter
    region: singapore
    schedule: "30 18 * * *"   # 00:00 IST (Render schedules in UTC)
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py close_stale_attendance"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        fromService:
          type: web
          name: teamtrack
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: teamtrack-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: ATTENDANCE_MAX_HOURS
        value: "9"
