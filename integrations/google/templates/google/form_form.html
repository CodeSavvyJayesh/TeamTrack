{% extends "base.html" %}
{% block content %}
<div class="row"><div class="col-lg-6">
  <div class="card"><div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/_form.html" %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-outline-secondary" href="{% url 'google_forms:list' %}">Cancel</a>
      </div>
    </form>
  </div></div>
  <p class="text-muted small mt-2 mb-0">
    Leave the Google IDs blank until credentials exist. Submission figures can
    be recorded manually in the meantime.
  </p>
</div></div>
{% endblock %}
